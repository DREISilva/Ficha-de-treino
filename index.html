<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17152c">
  <meta name="description" content="Sua ficha de treino, personagem RPG e histórico, salvos no seu aparelho.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=5">
  <title>Crônicas da Jornada · Caderno de Treino</title>
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Caderno de Treino, início">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span><strong>Caderno de Treino</strong><small>Sua jornada, no seu ritmo</small></span>
    </a>
    <div class="top-actions">
      <button id="installButton" class="button button-quiet hidden" type="button">Instalar</button>
      <button id="backupButton" class="button button-quiet" type="button">Exportar</button>
      <button id="restoreButton" class="button button-quiet" type="button">Restaurar</button>
      <input id="restoreInput" class="visually-hidden" type="file" accept="application/json,.json">
    </div>
  </header>
  <main class="shell">
    <div class="privacy-note"><span aria-hidden="true">🔒</span><span>Seus treinos ficam salvos neste aparelho e navegador. Não há sincronização automática.</span></div>
    <nav id="mainNav" class="main-nav" aria-label="Navegação principal">
      <button class="nav-button active" data-view="home" type="button"><span aria-hidden="true">⚔</span> Ficha</button>
      <button class="nav-button" data-view="journey" type="button"><span aria-hidden="true">✦</span> Jornada</button>
      <button class="nav-button" data-view="history" type="button"><span aria-hidden="true">📜</span> Histórico</button>
    </nav>
    <section id="appView" aria-live="polite"></section>
    <div id="saveStatus" class="save-status" role="status" aria-live="polite"></div>
  </main>
  <footer class="footer"><span>Caderno de Treino · Crônicas da Jornada</span><span>Dados guardados localmente</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
